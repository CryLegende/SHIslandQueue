# ----------------------------------------------------------------#
#                 Configuration de SHIslandQueue                  #
# ----------------------------------------------------------------#
#
# File d'attente pour la création d'îles SuperiorSkyblock2 : quand plusieurs joueurs créent leur île en même temps,
# les créations sont étalées, une par créneau, pour ne pas bloquer le serveur. Un joueur qui arrive pendant un créneau
# occupé est mis en file et son île est créée à son tour. Aucune commande joueur.
#
# Commande :
#   /shislandqueue reload   Recharge config.yml et messages.yml. La file, le créneau en cours et les créations en
#                           cours ne sont pas touchés.
#   /shislandqueue list     Affiche la file d'attente, l'intervalle réglé et le temps avant le prochain créneau.
#
# Permissions :
#   shislandqueue.admin           Toutes les commandes ci-dessus (op par défaut).
#   shislandqueue.admin.reload    /shislandqueue reload
#   shislandqueue.admin.list      /shislandqueue list
#
# Les textes envoyés aux joueurs et au staff sont dans messages.yml.

# Délai, en secondes, entre deux créations d'îles. Un nouvel intervalle s'applique à partir du prochain créneau.
creation-interval-seconds: 5
